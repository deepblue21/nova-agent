name: CI

on:
  push:
    # `main` TEK BASINA yetmiyordu: gelistirme `codex/**` dallarinda yapiliyor
    # ve PR acilmiyor, yani bu is akisi aylardir HIC kosmadi. Kosmayan CI, CI
    # degildir.
    branches: [ main, 'codex/**' ]
  pull_request:
  workflow_dispatch:

# Least-privilege default for the auto-provisioned GITHUB_TOKEN (public-repo
# hardening). Both jobs only read the checkout; no write scopes are needed.
permissions:
  contents: read

jobs:
  web-gateway:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Test the supported minimum (Vite 8 needs >=20.19) and current LTS.
        node: [ "20.19", "22" ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "${{ matrix.node }}"

      # Clean, reproducible installs from the committed lockfiles.
      - name: Install gateway deps
        working-directory: gateway
        run: npm ci
      - name: Install web deps
        working-directory: web
        run: npm ci

      - name: Secret scan (tracked files)
        run: node scripts/secret-scan.mjs

      - name: Docs consistency check (doc-claimed counts vs code)
        run: node scripts/docs-check.mjs

      - name: Unit tests (gateway)
        run: npm --prefix gateway test

      - name: Unit tests (web)
        run: npm --prefix web test

      # mDNS testleri de burada: tel biçimi `scripts/lib/mdns.mjs` ile
      # Android'deki `GatewayDiscovery.kt` arasında paylaşılan bir sözleşmedir.
      # Koşmazsa, biri bozulduğunda CI yeşil kalır ve eşleme sessizce kırılır.
      - name: Smoke-script unit tests
        run: |
          node --test \
            scripts/smoke-mobile-control-plane.test.mjs \
            scripts/smoke-mobilerun-worker.test.mjs \
            scripts/mdns.test.mjs \
            scripts/mdns-wire.test.mjs

      - name: Build web
        run: npm --prefix web run build

      - name: Dependency audit (gateway + web)
        run: |
          npm --prefix gateway audit --audit-level=moderate
          npm --prefix web audit --audit-level=moderate

      - name: Gateway live smoke (/health, auth, models)
        run: |
          REQ_TIMEOUT_MS=5000 MAX_RETRIES=0 GATEWAY_TOKEN=ci-smoke-token \
            node gateway/gateway.mjs &
          GW=$!
          for i in $(seq 1 20); do
            sleep 1
            curl -fsS http://localhost:8088/health >/dev/null 2>&1 && break
          done
          SMOKE_TIMEOUT_MS=20000 GATEWAY_URL=http://localhost:8088 \
            GATEWAY_TOKEN=ci-smoke-token node scripts/smoke-live.mjs
          kill "$GW" 2>/dev/null || true

      - name: Preflight must FAIL in production without a token
        run: |
          set +e
          NODE_ENV=production node gateway/gateway.mjs
          code=$?
          set -e
          test "$code" -ne 0 && echo "OK: gateway refused to start unauthenticated"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build gateway image
        run: docker build -t nova-gateway ./gateway

  # Standard-library worker suite; Python pinned to the project's
  # requires-python (>=3.12,<3.13) so CI matches uv.lock.
  mobile-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install worker deps (httpx only; tests are stdlib + mocks)
        run: python -m pip install "httpx>=0.27,<1"
      - name: Worker unit tests
        run: python3 mobile-worker/run_tests.py

  # JVM unit tests only — instrumented (emulator) tests remain a manual/
  # roadmap item. gradle-wrapper.jar is committed, so the wrapper works.
  android-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Android JVM unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
        working-directory: nova-android

  # Play SADECE release AAB kabul ediyor — ve o derleme bugune kadar hic
  # kosturulmadi. Debug'da minify KAPALI; release'de R8 + kaynak kucultme acik
  # ve proguard-rules.pro elle yazilmis. LiteRT-LM, JNI uzerinden Kotlin
  # siniflarina geri cagri yapiyor: eksik bir -keep kurali YALNIZ release'de,
  # yani ancak magazada patlar. Bu isin yeri bir insanin eli degil, CI.
  #
  # Imza anahtari depoda yok; build.gradle.kts anahtar yoksa imzasiz uretiyor,
  # dolayisiyla bu is sirlar olmadan kosar.
  android-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # Once ayri ayri: lint HIC kosturulmadi ve abortOnError = true.
      # continue-on-error, raporun her hâlükârda yuklenmesi icin — hatanin
      # kendisi bir sonraki adimda zaten derlemeyi durduruyor
      # (checkReleaseBuilds = true).
      - name: Lint (release)
        id: lint
        continue-on-error: true
        run: ./gradlew --no-daemon :app:lintRelease
        working-directory: nova-android

      - name: Release bundle (unsigned without a keystore)
        run: ./gradlew --no-daemon :app:bundleRelease
        working-directory: nova-android

      # Basarisiz kossa da yuklenir: asil deger raporun kendisinde.
      # usage.txt R8'in NEYI ATTIGINI gosterir — eksik bir -keep kuralini
      # magazada degil burada gormenin tek yolu.
      - name: Reports (lint + R8)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-release-reports
          if-no-files-found: warn
          path: |
            nova-android/app/build/reports/lint-results-release.*
            nova-android/app/build/outputs/mapping/release/
