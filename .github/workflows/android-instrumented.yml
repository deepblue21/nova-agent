# Enstrümanlı (emülatör) Compose testleri — ROADMAP "Sürekli" maddesi.
#
# Kasıtlı olarak yalnız elle tetiklenir (workflow_dispatch): emülatör işi
# yavaştır ve her push'ı bekletmemelidir. Actions sekmesinden "Run workflow"
# ile başlatılır; PR öncesi veya release öncesi koşulması önerilir.
name: Android instrumented (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  connected:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # ubuntu-latest runner'larda donanım hızlandırma için KVM'i aç.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Connected Compose tests (API 34 x86_64)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          working-directory: nova-android
          script: ./gradlew --no-daemon connectedDebugAndroidTest

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: connected-test-reports
          path: nova-android/app/build/reports/androidTests/
          if-no-files-found: ignore
