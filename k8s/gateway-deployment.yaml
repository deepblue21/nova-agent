apiVersion: apps/v1
kind: Deployment
metadata:
  name: nova-gateway
  namespace: nova
  labels:
    app: nova-gateway
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nova-gateway
  template:
    metadata:
      labels:
        app: nova-gateway
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      # Idempotent migrations run before the app container starts. Safe to run
      # per-pod: migrate.mjs tracks applied files in schema_migrations.
      initContainers:
        - name: migrate
          # Replace with the immutable digest of your published release.
          image: ghcr.io/OWNER/nova-gateway@sha256:REPLACE_WITH_RELEASE_DIGEST
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          command: ["node", "migrate.mjs"]
          envFrom:
            - secretRef:
                name: nova-secrets
      containers:
        - name: gateway
          image: ghcr.io/OWNER/nova-gateway@sha256:REPLACE_WITH_RELEASE_DIGEST
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          ports:
            - containerPort: 8088
          envFrom:
            - configMapRef:
                name: nova-config
            - secretRef:
                name: nova-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8088
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8088
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
