# NOVA / Project Horus — merkezi sürüm kataloğu.
#
# Tüm bağımlılık sürümleri BURADA yaşar. build.gradle.kts dosyalarında
# çıplak sürüm dizesi bırakma; yükseltmeler tek dosyadan yapılsın.
#
# Sürümler 2026-08-09'da doğrulandı:
#   - AndroidX: developer.android.com/jetpack/androidx/versions
#   - Compose BOM: developer.android.com/develop/ui/compose/bom/bom-mapping
[versions]

# ——— Build araçları ———
# AGP 9.2 en fazla API 37'yi destekliyor; compileSdk 37 bu tavanın tam sınırında.
# Daha ileri bir compileSdk istenirse ÖNCE AGP yükseltilmeli.
agp = "9.2.1"

# DİKKAT — Kotlin'i keyfi yükseltme.
# litertlm-android (0.13.1 ve 0.14.0), Kotlin 2.3 metadata'sıyla derlendi. Kotlin 2.2.x
# bunu okuyabiliyor (metadata bir minör sürüm ileri uyumlu) ve kütüphanenin
# stdlib pini de 2.2.21. Compose 1.11.4 de aynı şekilde okunabiliyor.
# Eğer derlemede "was compiled with a newer Kotlin compiler" hatası alırsan
# tek yapman gereken burayı "2.3.21" yapmak — litertlm bundan etkilenmez,
# çünkü yeni derleyici eski metadata'yı her zaman okur.
kotlin = "2.2.21"

# ——— Android SDK ———
# compileSdk ve targetSdk BİLEREK farklı; ikisi farklı şeyler:
#
#   compileSdk = 37 — yalnız "hangi API'lere karşı derleniyoruz". androidx.core
#     1.19.0 ve lifecycle 2.11.0 `minCompileSdk=37` koyuyor; 36'da kalırsak
#     derleme `checkDebugAarMetadata` adımında düşer. Çalışma zamanı davranışını
#     DEĞİŞTİRMEZ.
#   targetSdk = 36 — "hangi sürümün çalışma zamanı davranışını kabul ediyoruz".
#     31 Ağustos 2026'dan itibaren Play yeni uygulama ve güncellemelerde en az
#     targetSdk 36 istiyor; 37'ye çıkmak yeni davranış değişikliklerini
#     üstlenmek demek olurdu ve şu an gereksiz.
#
# compileSdk 37 için SDK Platform 37 kurulu olmalı:
#   sdkmanager "platforms;android-37"
compileSdk = "37"
targetSdk = "36"
minSdk = "26"

# ——— AndroidX ———
androidxCore = "1.19.0"            # 2026-07-01

# WorkManager — K2: model indirmesi uygulama yasam dongusunden KOPARILDI.
# 2.11.2 (2026-03-25) son stabil. DIKKAT: work-runtime-ktx artifact'i 2.9.0'dan
# beri BOS; CoroutineWorker dahil her sey ana work-runtime icinde, o yuzden
# -ktx degil bunu kullaniyoruz.
work = "2.11.2"
androidxActivity = "1.13.0"        # 2026-03-11
androidxLifecycle = "2.11.0"       # 2026-06-17
androidxDatastore = "1.2.1"        # 2026-07-29

# Compose BOM 2026.06.01 → compose.* 1.11.4, material3 1.4.0.
# BOM tek tek Compose sürümlerini yönettiği için aşağıdaki compose
# bağımlılıklarına sürüm YAZILMAZ.
composeBom = "2026.06.01"

# ——— Üçüncü taraf ———
# OkHttp 5.x: Response.body artık non-null. Koddaki `?.`/`?:` kullanımları
# derlenir (yalnız "gereksiz güvenli çağrı" uyarısı verir), davranış aynıdır.
okhttp = "5.4.0"
coroutines = "1.11.0"

# Cihaz-üstü LLM motoru. Sabit sürüm — model dosyası formatı bu sürüme bağlı.
#
# 0.13.1 (2026-06-04) → 0.14.0 (2026-07-08). Yükseltmenin tek gerekçesi
# hızlandırma: kod artık Backend.CPU()'ya çakılı değil, Otomatik/CPU/GPU/NPU
# seçilebiliyor (bkz. LocalEngineSettings.kt + OnDeviceEngine.ensureLoaded).
# Kullanılan API yüzeyi aynı kaldı: EngineConfig(modelPath, backend, cacheDir),
# ConversationConfig(systemInstruction, initialMessages, tools, samplerConfig),
# sendMessageAsync(prompt, MessageCallback, extraContext).
#
# Google Maven'de 0.15.0 da var (2026-08-01) ama bir haftalık; fiziksel cihazda
# 0.14.0 doğrulanmadan üstüne çıkma. Yükseltirken sırayla: assembleDebug →
# gerçek ARM64 telefonda Otomatik/CPU/GPU üçünü de dene.
litertlm = "0.14.0"

# ——— Test ———
junit = "4.13.2"
orgJson = "20240303"
androidxTestJunit = "1.2.1"
androidxTestEspresso = "3.7.0"

[libraries]

# Compose (sürümler BOM'dan gelir)
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }

# AndroidX
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "androidxCore" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "androidxActivity" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "androidxLifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "androidxLifecycle" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "androidxDatastore" }
androidx-work-runtime = { group = "androidx.work", name = "work-runtime", version.ref = "work" }

# Ağ / eşzamanlılık
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-sse = { group = "com.squareup.okhttp3", name = "okhttp-sse", version.ref = "okhttp" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

# Cihaz-üstü LLM
litertlm-android = { group = "com.google.ai.edge.litertlm", name = "litertlm-android", version.ref = "litertlm" }

# Test
junit = { group = "junit", name = "junit", version.ref = "junit" }
org-json = { group = "org.json", name = "json", version.ref = "orgJson" }
androidx-test-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestJunit" }
androidx-test-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "androidxTestEspresso" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
